; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    ESP Async WebServer @ ^1.2.3
    ESPAsyncTCP @ ^1.2.2
    DHT sensor library @ ^1.4.4
    OneWire @ ^2.3.7
    DallasTemperature @ ^3.9.1
    ArduinoJson @ ^7.0.0
    LiquidCrystal_I2C @ ^1.1.2
    mobizt/Firebase ESP32 Client @ ^4.4.14
build_flags = 
    -DCORE_DEBUG_LEVEL=0
upload_speed = 115200
monitor_speed = 115200
; SPIFFS configuration for web files
board_build.spiffs_start = 0x290000
board_build.spiffs_size = 1048576
board_build.spiffs_page_size = 256
board_build.spiffs_block_size = 4096

; PlatformIO will upload SPIFFS files from data/ folder during 'uploadfs' command
; Files placed in 'data/' folder (HTML, CSS, JS) will be uploaded to ESP32 SPIFFS
