; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Pinned to a core-2.0.x release. The Firebase Realtime Database is now reached
; through the ESP32 core's own WiFiClientSecure + HTTPClient (see main.cpp), so
; the old "Failed to initialize the SSL layer" fault from the mobizt library is
; gone. The pin stays because "ESP Async WebServer" (me-no-dev 1.2.3) does not
; compile against Arduino-ESP32 core 3.x, which unpinning would pull in.
; 6.4.0 ships Arduino core 2.0.11 and downloads a clean framework package.
; After changing this, run a clean rebuild: pio run -t clean && pio run
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
lib_deps =
    ESP Async WebServer @ ^1.2.3
    ESPAsyncTCP @ ^1.2.2
    DHT sensor library @ ^1.4.4
    OneWire @ ^2.3.7
    DallasTemperature @ ^3.9.1
    ArduinoJson @ ^7.0.0
    LiquidCrystal_I2C @ ^1.1.2
build_flags =
    -DCORE_DEBUG_LEVEL=0
upload_speed = 115200
monitor_speed = 115200
; SPIFFS configuration for web files
board_build.spiffs_start = 0x290000
board_build.spiffs_size = 1048576
board_build.spiffs_page_size = 256
board_build.spiffs_block_size = 4096

; PlatformIO will upload SPIFFS files from data/ folder during 'uploadfs' command
; Files placed in 'data/' folder (HTML, CSS, JS) will be uploaded to ESP32 SPIFFS
